plugins {
    id "com.android.application"
}

android {
    namespace "com.shin.catlockwallpaper"
    compileSdk 35

    sourceSets {
        main {
            assets.srcDir layout.buildDirectory.dir("generated/webAssets").get().asFile
        }
    }

    defaultConfig {
        applicationId "com.shin.catlockwallpaper"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "0.2.4"
    }
}

dependencies {
    // WebView-based live wallpaper: renders the GitHub Pages depth-parallax lockscreen.
    // No Filament/GLB (legacy) anymore — WebView + sensors are in the platform SDK.
}

def webRoot = rootProject.projectDir.parentFile

tasks.register("syncWebWallpaperAssets", Copy) {
    into layout.buildDirectory.dir("generated/webAssets")

    from(webRoot) {
        include "index.html"
        include "app.js"
        include "style.css"
    }
    from(new File(webRoot, "vendor")) {
        into "vendor"
        include "three.module.js"
    }
    from(new File(webRoot, "assets")) {
        into "assets"
        include "photo3d_cherry2dio/**"
        include "photo3d_latte2dio/**"
        include "photo3d_nila2dio/**"
    }
}

tasks.named("preBuild") {
    dependsOn("syncWebWallpaperAssets")
}
